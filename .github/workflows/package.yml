name: Release Windows EXE
run-name: Release ${{ github.ref_name }}

# Only tag pushes create a run. Branch pushes, PRs and manual dispatches do not.
on:
  push:
    tags:
      - '**'

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.event.deleted == false
    permissions:
      contents: write
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: |
          $ErrorActionPreference = 'Stop'
          $toolchain = (Select-String -LiteralPath rust-toolchain.toml -Pattern '^\s*channel\s*=\s*"([^"]+)"').Matches.Groups[1].Value
          if (-not $toolchain) { throw 'Missing channel in rust-toolchain.toml' }
          rustup toolchain install "${toolchain}-x86_64-pc-windows-msvc" --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # package.ps1 calls build.ps1 -Release (cargo build --locked).
      # No test, check, PR, branch or scheduled workflow is configured.
      - name: Build and package
        id: package
        run: |
          $ErrorActionPreference = 'Stop'
          # Tags may contain slashes or characters invalid in Windows filenames.
          $version = ($env:GITHUB_REF_NAME -replace '^[vV](?=.)', '') -replace '[^a-zA-Z0-9._-]', '-'
          $version = $version.Trim('-', '_', '.')
          if (-not $version) { throw 'Tag does not produce a usable package version' }
          ./scripts/package.ps1 -Version $version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = "dist/single-exe-v$version/MimonitorToolbox.exe"
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw "Missing executable: $exe" }
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "exe=$exe" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "### MimonitorToolbox.exe`nSHA256: ``$hash``" >> $env:GITHUB_STEP_SUMMARY

      - name: Publish the standalone EXE to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_EXE: ${{ steps.package.outputs.exe }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          $exe = $env:RELEASE_EXE
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw "Missing executable: $exe" }
          $notes = Join-Path '.github/release-notes' "$tag.md"
          $releaseArgs = @('release', 'create', $tag, $exe, '--repo', $env:GH_REPO, '--verify-tag', '--title', $tag)
          if (Test-Path -LiteralPath $notes -PathType Leaf) {
            $releaseArgs += @('--notes-file', $notes)
          } else {
            $releaseArgs += '--generate-notes'
          }
          # gh uploads this runner's EXE before publishing the release.
          # An existing release is never overwritten or clobbered.
          & gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
